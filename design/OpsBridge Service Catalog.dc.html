<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-4b89cee6-cb9a-4401-bf8d-62d51fbeaab0/styles.css">
<script src="_ds/organic-4b89cee6-cb9a-4401-bf8d-62d51fbeaab0/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:#ddd5c9;font-family:var(--font-body)}
*{box-sizing:border-box}
a{color:#a95a28;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</helmet>

<div style="display:flex;flex-direction:column">
  <div data-screen-label="Service catalog — admin, drawer open" style="position:relative">
    <div style="position:absolute;z-index:50;top:0;left:0;padding:6px 14px;border-bottom-right-radius:12px;background:#241f19;color:#f3eee6;font-size:11px;letter-spacing:.14em;text-transform:uppercase">Admin · drawer open · click other rows</div>
    <dc-import name="ServiceCatalogScreen" theme="light" role="admin" initial-service="identity-svc" hint-size="100%,880px"></dc-import>
  </div>
  <div data-screen-label="Service catalog — operator, list only" style="position:relative">
    <div style="position:absolute;z-index:50;top:0;left:0;padding:6px 14px;border-bottom-right-radius:12px;background:#241f19;color:#f3eee6;font-size:11px;letter-spacing:.14em;text-transform:uppercase">Operator · no “Add service”</div>
    <dc-import name="ServiceCatalogScreen" theme="light" role="operator" hint-size="100%,880px"></dc-import>
  </div>
  <div data-screen-label="Service catalog — admin dark, drawer open" style="position:relative">
    <div style="position:absolute;z-index:50;top:0;left:0;padding:6px 14px;border-bottom-right-radius:12px;background:#f3ece0;color:#17150f;font-size:11px;letter-spacing:.14em;text-transform:uppercase">Admin · dark</div>
    <dc-import name="ServiceCatalogScreen" theme="dark" role="admin" initial-service="payments-api" hint-size="100%,880px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}"></script>
</body>
</html>
