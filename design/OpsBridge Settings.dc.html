<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-4b89cee6-cb9a-4401-bf8d-62d51fbeaab0/styles.css">
<script src="_ds/organic-4b89cee6-cb9a-4401-bf8d-62d51fbeaab0/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0;background:#ddd5c9;font-family:"Figtree","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
a{color:#a95a28;text-decoration:none}
a:hover{text-decoration:underline}
</style>
</helmet>

<div style="display:flex;flex-direction:column">
  <div data-screen-label="Settings — English, light" style="display:flex;flex-direction:column">
    <div style="padding:8px 20px;background:#241f19;color:#f3eee6;font-size:11px;letter-spacing:.14em;text-transform:uppercase">English · light · toggles are live</div>
    <dc-import name="SettingsScreen" theme="light" lang="en" hint-size="100%,760px"></dc-import>
  </div>
  <div data-screen-label="Settings — Japanese, dark" style="display:flex;flex-direction:column">
    <div style="padding:8px 20px;background:#f3ece0;color:#17150f;font-size:11px;letter-spacing:.14em;text-transform:uppercase">日本語 · dark · toggles are live</div>
    <dc-import name="SettingsScreen" theme="dark" lang="ja" hint-size="100%,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440}}"></script>
</body>
</html>
