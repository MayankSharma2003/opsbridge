services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsbridge}
      POSTGRES_USER: ${POSTGRES_USER:-opsbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - opsbridge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsbridge} -d ${POSTGRES_DB:-opsbridge}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsbridge-postgres-data:
