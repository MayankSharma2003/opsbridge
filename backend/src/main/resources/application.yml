spring:
  application:
    name: opsbridge-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opsbridge}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate must never auto-generate or alter it.
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    # No default host: leaving MAIL_HOST unset means Spring Boot never creates a JavaMailSender,
    # and the app boots normally with notifications skipped rather than failing on startup.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Bound the SMTP handshake. Sending is off the request thread, but an unbounded hang
          # would still pin a mail-pool thread indefinitely.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  data:
    web:
      pageable:
        # Hard ceiling so a client cannot ask for an effectively unbounded page.
        max-page-size: 100
        default-page-size: 25

server:
  port: ${SERVER_PORT:8080}

opsbridge:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  mail:
    enabled: true
    from: ${MAIL_FROM:}
    # Fixed team intake address, comma-separated for more than one. A freshly declared incident has
    # no assignee yet, so there is no individual to route to.
    notify-to: ${MAIL_NOTIFY_TO:}
  realtime:
    # How long a websocket may stay connected without presenting a token before it is closed.
    auth-deadline-ms: ${REALTIME_AUTH_DEADLINE_MS:5000}
    auth-sweep-ms: ${REALTIME_AUTH_SWEEP_MS:5000}
    # How often to re-evaluate open incidents for SLA breaches. A breach has no writer, so this
    # sweep is the only thing that notices one at the moment it happens.
    sla-sweep-ms: ${REALTIME_SLA_SWEEP_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health
