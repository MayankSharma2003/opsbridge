services:
  backend:
    image: ${DOCKERHUB_USERNAME}/opsbridge:${IMAGE_TAG}
    container_name: opsbridge-backend
    restart: unless-stopped

    env_file:
      - path: /etc/opsbridge/opsbridge.env
        format: raw

    ports:
      - "127.0.0.1:8080:8080"

    mem_limit: 600m

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
