name: CI/CD
 
on:
  push:
    branches: [main]
  pull_request:
 
env:
  IMAGE_NAME: opsbridge
 
concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'opsbridge-production' || format('ci-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
 
jobs:
  # ---------------------------------------------------------------- CI
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B test
 
  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: http://localhost:8080
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
 
  # ---------------------------------------------------------------- CD
  build-and-push:
    name: Build image and push to Docker Hub
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
 
      # Gates only the actual deploy path, not every PR -- placing this in backend-test
      # instead would fail routine, unrelated development work the moment V8 exists with
      # placeholders still in it, long before you're ready to generate real prod secrets.
      - name: Reject placeholder production credentials
        working-directory: backend
        run: |
          if grep -qE 'PASTE_(VIEWER|OPERATOR|ADMIN)_HASH_HERE' \
            src/main/resources/db/migration/V8__update_prod_credentials.sql; then
            echo "::error::V8 still contains placeholder BCrypt hashes. Generate real ones (Part 6.5) before deploying."
            exit 1
          fi
 
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
 
      - name: Build JAR
        working-directory: backend
        run: ./mvnw -B clean package -DskipTests
 
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
 
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          npm ci
          npm run build
 
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
 
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
 
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      - name: Download frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist
 
      - name: Copy compose file to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu"
          overwrite: true
 
      # Backend goes live and is proven healthy BEFORE the frontend changes. If the
      # health check below fails, the OLD frontend remains untouched -- but note the
      # backend container has already been replaced by this point (see Part 11).
      - name: Deploy backend
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
            cd /home/ubuntu
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
 
      - name: Smoke test — internal
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "Healthy after ${i} attempts."
                # Only cleaned up now that the new image is confirmed working -- if this
                # branch is never reached, the previous, last-known-good image stays on
                # disk, available for an immediate local rollback rather than a registry pull.
                docker image prune -af
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed. Recent logs:"
            docker logs --tail 50 opsbridge-backend
            exit 1
 
      # Only reached once the backend is confirmed healthy above.
      - name: Copy frontend to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          fingerprint: ${{ secrets.EC2_SSH_FINGERPRINT }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/opsbridge"
          strip_components: 1
          overwrite: true
 
      - name: Smoke test — external
        env:
          SITE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: curl -fsS "${SITE_URL%/}/" > /dev/null
